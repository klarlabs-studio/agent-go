name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
          cache: true

      - name: Run core tests
        run: go test -race ./...

      - name: Run contrib tests
        # Release must cover contrib modules, not only the root module.
        # Storage modules use -short (they gate on external services), matching
        # the Contrib workflow matrix.
        run: |
          set -euo pipefail
          go work sync
          for dir in contrib/*/; do
            m=$(basename "$dir")
            echo "== testing contrib/$m =="
            if [[ "$m" == storage-* ]]; then
              (cd "$dir" && go test -race -short -timeout=5m ./...)
            else
              (cd "$dir" && go test -race -timeout=5m ./...)
            fi
          done

      - name: Build
        run: go build ./...

      - name: Build contrib
        run: make contrib-build

      - name: Verify module
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to pkg.go.dev
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'

      - name: Trigger pkg.go.dev update
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          curl -s "https://proxy.golang.org/go.klarlabs.de/agent/@v/${VERSION}.info" || true
